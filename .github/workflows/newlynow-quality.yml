name: NewlyNow Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - newlynow-theme-moburst-inspired

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test tooling
        run: npm install --no-audit --no-fund

      - name: Validate repository invariants
        run: npm run validate

      - name: Test Firestore security rules
        run: npm run test:rules
