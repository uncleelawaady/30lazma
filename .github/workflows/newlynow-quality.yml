name: NewlyNow Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - newlynow-theme-moburst-inspired

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate repository
        run: node scripts/validate-newlynow.mjs
